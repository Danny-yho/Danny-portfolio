<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart | Shop with Vikky</title><meta name="theme-color" content="#3B0B73"><link rel="icon" href="/images/logo-icon.svg"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/styles.css"></head>
<body><div class="preloader"><img src="/images/loader-shopping-silhouette.png" alt=""></div><div data-header></div><main id="main" class="section"><div class="container-main"><h1 class="h2 mb-4">Your bag</h1><div class="row g-4"><div class="col-lg-8"><div id="cartRows" class="glass p-3 p-md-4"></div></div><aside class="col-lg-4"><div class="glass p-4"><h2 class="h5">Order summary</h2><div class="d-flex justify-content-between mt-3"><span>Subtotal</span><strong id="subtotal">₦0</strong></div><div class="d-flex justify-content-between mt-2"><span>Delivery estimate</span><strong>Calculated at checkout</strong></div><a id="checkoutLink" class="btn btn-glossy w-100 mt-4" href="/checkout.html">Proceed to Checkout</a></div></aside></div></div></main><div data-footer></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script><script src="/js/app.js" defer></script><script>document.addEventListener('DOMContentLoaded',()=>{const render=()=>{const cart=getCart(),host=document.getElementById('cartRows');if(!cart.length){host.innerHTML=`<div class="text-center p-4"><img class="empty-icon" src="/images/logo-icon.svg" alt="Empty shopping bag"><h2 class="h4 mt-3">Your bag is waiting</h2><p>Discover something beautiful.</p><a class="btn btn-glossy" href="/shop.html">Start Shopping</a></div>`;document.getElementById('subtotal').textContent=formatNGN(0);document.getElementById('checkoutLink').classList.add('disabled');return}host.innerHTML=cart.map((x,i)=>`<div class="cart-row py-3 border-bottom"><img src="${x.image}" alt="${x.name}"><div><strong>${x.name}</strong><div class="small">${x.size||''} ${x.color||''}</div><button class="btn btn-link p-0 text-danger" data-remove="${i}">Remove</button></div><input class="form-control" style="width:75px" type="number" min="1" max="99" value="${x.qty}" data-qty="${i}" aria-label="Quantity for ${x.name}"><strong class="cart-total">${formatNGN(x.price*x.qty)}</strong></div>`).join('');document.getElementById('subtotal').textContent=formatNGN(cart.reduce((n,x)=>n+x.price*x.qty,0));document.querySelectorAll('[data-qty]').forEach(e=>e.onchange=()=>{cart[Number(e.dataset.qty)].qty=Math.max(1,Number(e.value));setCart(cart);render()});document.querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{cart.splice(Number(e.dataset.remove),1);setCart(cart);render()})};render()})</script></body></html>
