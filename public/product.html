<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | Shop with Vikky</title><meta name="theme-color" content="#3B0B73"><link rel="icon" href="/images/logo-icon.svg"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/styles.css"></head>
<body><div class="preloader"><img src="/images/loader-shopping-silhouette.png" alt=""></div><a class="skip-link" href="#main">Skip</a><div data-header></div><main id="main" class="section"><div class="container-main"><div id="product" class="glass p-3 p-md-4"></div><section class="mt-5"><h2 class="h4 mb-3">You may also love</h2><div class="product-grid" id="related"></div></section></div></main><div data-footer></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script><script src="/js/app.js" defer></script><script>
document.addEventListener('DOMContentLoaded',async()=>{
  const all=await loadProducts(),id=Number(new URLSearchParams(location.search).get('id'))||all[0]?.id,p=all.find(x=>x.id===id)||all[0];
  if(!p){document.getElementById('product').innerHTML='<div class="p-5 text-center"><h1>We could not find that style</h1><a class="btn btn-glossy" href="/shop.html">Back to the shop</a></div>';return}
  const imgs=p.images?.length?p.images:['https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=900&q=80'];
  document.title=p.name+' | Shop with Vikky';
  document.getElementById('product').innerHTML=`<div class="row g-4"><div class="col-md-6"><img class="gallery-main w-100" id="gallery" src="${imgs[0]}" alt="${p.name}" data-image-fallback><div class="d-flex gap-2 mt-2">${imgs.map((x,i)=>`<button class="border-0 p-0 bg-transparent" data-img="${i}" aria-label="View image ${i+1}"><img src="${x}" style="width:72px;height:72px;object-fit:cover;border-radius:8px" alt="" data-image-fallback></button>`).join('')}</div></div><div class="col-md-6"><p class="eyebrow">${p.category||'Shop with Vikky'}</p><h1 class="h2">${p.name}</h1><div class="price h4">${formatNGN(p.price)}</div><p>${p.description||'A beautifully curated fashion piece designed for confidence, comfort and standout Nigerian style.'}</p><label class="d-block fw-bold" id="sizeLabel">Choose your size</label><div id="sizes" role="group" aria-labelledby="sizeLabel">${(p.sizes||[]).map(s=>`<button class="option-chip" type="button" data-size="${s}" aria-pressed="false">${s}</button>`).join('')||'<span>One size</span>'}</div><label class="d-block fw-bold mt-3" id="colorLabel">Choose your color</label><div id="colors" role="group" aria-labelledby="colorLabel">${(p.colors||[]).map(c=>`<button class="option-chip" type="button" data-color="${c}" aria-pressed="false">${c}</button>`).join('')||'<span>As pictured</span>'}</div><div class="d-flex align-items-center gap-2 mt-3"><label for="qty">Quantity</label><input id="qty" class="form-control" style="width:90px" type="number" min="1" max="${p.stock||1}" value="1" ${p.stock<1?'disabled':''}></div><p class="mt-2 stock-status">${p.stock>0?`In stock — ${p.stock} available`:'Currently out of stock'}</p><button id="addCart" class="btn btn-glossy" ${p.stock<1?'disabled':''}>Add to Cart</button> <a id="waProduct" class="btn btn-outline-brand" target="_blank" rel="noopener" href="${WHATSAPP}">Ask about this style</a></div></div>`;
  document.querySelectorAll('[data-img]').forEach(b=>b.onclick=()=>document.getElementById('gallery').src=imgs[Number(b.dataset.img)]);
  let size='',color='';
  document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-size]').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-pressed','false')});b.classList.add('active');b.setAttribute('aria-pressed','true');size=b.dataset.size});
  document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-color]').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-pressed','false')});b.classList.add('active');b.setAttribute('aria-pressed','true');color=b.dataset.color});
  document.getElementById('addCart').onclick=()=>{
    if((p.sizes?.length&&!size)||(p.colors?.length&&!color)){toast('Choose your size and color first');return}
    const quantity=Number(document.getElementById('qty').value||1);
    if(!Number.isInteger(quantity)||quantity<1||quantity>p.stock){toast('Choose a quantity available in stock');return}
    const cart=getCart(),key=`${p.id}-${size}-${color}`,item=cart.find(x=>x.key===key);
    if((item?.qty||0)+quantity>p.stock){toast('There is not enough stock for that quantity');return}
    if(!item)cart.push({key,id:p.id,name:p.name,price:p.price,image:imgs[0],size,color,qty:quantity});else item.qty+=quantity;
    setCart(cart);toast('Added to your bag');
  };
  document.getElementById('waProduct').href=`${WHATSAPP}?text=${encodeURIComponent(`Hello Shop with Vikky, I have a question about ${p.name}`)}`;
  document.getElementById('related').innerHTML=all.filter(x=>x.id!==p.id&&x.category===p.category).concat(all.filter(x=>x.id!==p.id)).slice(0,4).map(productCard).join('');
});
</script></body></html>
