<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track order | Shop with Vikky</title><meta name="theme-color" content="#3B0B73"><link rel="icon" href="/images/logo-icon.svg"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/styles.css"></head>
<body><div class="preloader"><img src="/images/loader-shopping-silhouette.png" alt=""></div><div data-header></div><main id="main" class="section"><div class="container-main" style="max-width:700px"><div class="glass p-4"><h1 class="h3">Track your order</h1><form id="track" class="row g-3 mt-1"><div class="col-md-6"><label class="form-label">Order number</label><input class="form-control" name="orderNumber" required></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" required></div><div class="col-12"><button class="btn btn-glossy">Track Order</button></div></form><div id="result" class="mt-4"></div></div></div></main><div data-footer></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script><script src="/js/app.js" defer></script><script>document.addEventListener('DOMContentLoaded',()=>document.getElementById('track').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);try{const d=await api(`/orders/track?orderNumber=${encodeURIComponent(fd.get('orderNumber'))}&phone=${encodeURIComponent(fd.get('phone'))}`);document.getElementById('result').innerHTML=`<div class="alert alert-light"><strong>Status:</strong> ${d.order.status}<br><strong>Payment:</strong> ${d.order.paymentStatus}</div>`}catch(err){document.getElementById('result').innerHTML=`<div class="alert alert-danger">${err.message}</div>`}})</script></body></html>
