<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact | Shop with Vikky</title><meta name="theme-color" content="#3B0B73"><link rel="icon" href="/images/logo-icon.svg"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/styles.css"></head>
<body><div class="preloader"><img src="/images/loader-shopping-silhouette.png" alt=""></div><div data-header></div><main id="main" class="section"><div class="container-main" style="max-width:850px"><div class="glass p-4 p-md-5"><h1 class="h2">Let's talk</h1><p>Questions about fit, delivery or an order? Send us a message.</p><form id="contact" class="row g-3"><div class="col-md-6"><label class="form-label">Name</label><input class="form-control" name="name" required></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div><div class="col-12"><label class="form-label">Phone</label><input class="form-control" name="phone"></div><div class="col-12"><label class="form-label">Message</label><textarea class="form-control" name="message" rows="5" required></textarea></div><div class="col-12"><button class="btn btn-glossy">Send Message</button></div></form></div></div></main><div data-footer></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script><script src="/js/app.js" defer></script><script>document.addEventListener('DOMContentLoaded',()=>document.getElementById('contact').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);try{await api('/contact',{method:'POST',body:JSON.stringify(Object.fromEntries(fd))});toast('Message sent. We will be in touch!');e.target.reset()}catch(err){toast(err.message)}})</script></body></html>
