<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shop | Shop with Vikky</title><meta name="theme-color" content="#3B0B73">
  <link rel="icon" href="/images/logo-icon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="preloader"><img src="/images/loader-shopping-silhouette.png" alt=""></div>
  <a class="skip-link" href="#main">Skip to products</a>
  <div data-header></div>
  <main id="main" class="section">
    <div class="container-main">
      <div class="shop-heading">
        <div><p class="eyebrow">Find your next favourite</p><h1 class="section-title">The <span>Vikky</span> Shop</h1></div>
        <a class="shop-help" href="https://wa.me/2347030660694?text=Hi%20Shop%20with%20Vikky%2C%20I%20need%20help%20choosing%20an%20outfit" target="_blank" rel="noopener">Need help choosing?</a>
      </div>
      <div class="filters glass p-3" role="search" aria-label="Filter products">
        <label class="filter-field filter-search"><span>Search styles</span><input id="search" class="form-control" placeholder="Try “dress” or “Ankara”" aria-label="Search products"></label>
        <label class="filter-field"><span>Category</span><select id="category" class="form-select" aria-label="Category"><option value="">All styles</option><option>Dresses</option><option>Tops</option><option>Skirts</option><option>Two-Piece Sets</option><option>Jumpsuits</option><option>Bags & Accessories</option><option>Ankara/Native Wear</option><option>Footwear</option></select></label>
        <label class="filter-field"><span>Size</span><select id="size" class="form-select" aria-label="Size"><option value="">Any size</option><option>XS</option><option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option><option>One Size</option></select></label>
        <label class="filter-field"><span>Sort by</span><select id="sort" class="form-select" aria-label="Sort products"><option value="newest">Featured</option><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option></select></label>
        <label class="filter-field price-filter"><span>Price range (₦)</span><div class="price-range"><input id="minPrice" class="form-control" type="number" min="0" placeholder="Min" aria-label="Minimum price"><span aria-hidden="true">–</span><input id="maxPrice" class="form-control" type="number" min="0" placeholder="Max" aria-label="Maximum price"></div></label>
        <button id="clearFilters" class="btn btn-outline-brand filter-clear" type="button">Clear filters</button>
      </div>
      <p id="resultCount" class="result-count" aria-live="polite"></p>
      <div class="product-grid" id="products"></div>
      <nav id="pagination" class="pagination-row" aria-label="Product pages"></nav>
    </div>
  </main>
  <div data-footer></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="/js/app.js" defer></script><script src="/js/shop.js" defer></script>
</body>
</html>
