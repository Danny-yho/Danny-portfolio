<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Shop with Vikky</title><meta name="theme-color" content="#3B0B73"><link rel="icon" href="/images/logo-icon.svg"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/styles.css"></head>
<body><div class="preloader"><img src="/images/loader-shopping-silhouette.png" alt=""></div><div data-header></div><main id="main" class="section"><div class="container-main"><p class="eyebrow">A few details, then your order is placed</p><h1 class="h2 mb-4">Checkout</h1><form id="checkout" class="row g-4"><div class="col-lg-7"><div class="glass p-4"><h2 class="h5">Where should we deliver?</h2><div class="row g-3 mt-1"><div class="col-md-6"><label class="form-label" for="fullName">Full name</label><input id="fullName" class="form-control" name="fullName" autocomplete="name" required></div><div class="col-md-6"><label class="form-label" for="phone">Phone</label><input id="phone" class="form-control" name="phone" type="tel" autocomplete="tel" required pattern="[0-9+ ]{7,16}" placeholder="080 1234 5678"></div><div class="col-12"><label class="form-label" for="email">Email</label><input id="email" class="form-control" type="email" name="email" autocomplete="email" required></div><div class="col-12"><label class="form-label" for="address">Delivery address</label><input id="address" class="form-control" name="address" autocomplete="street-address" required></div><div class="col-md-6"><label class="form-label" for="state">State</label><select class="form-select" name="state" id="state" autocomplete="address-level1" required></select></div><div class="col-12"><label class="form-label" for="notes">Delivery note <span class="fw-normal">(optional)</span></label><textarea id="notes" class="form-control" name="notes" rows="2" placeholder="Landmark or helpful directions"></textarea></div></div></div></div><aside class="col-lg-5"><div class="glass p-4 checkout-summary"><h2 class="h5">Your order</h2><div id="summary"></div><fieldset class="mt-3"><legend class="h6">How would you like to pay?</legend><label class="payment-choice d-block p-2"><input type="radio" name="payment" value="paystack"> Pay securely with Paystack <small id="paystackAvailability" class="d-block ms-4 text-muted"></small></label><label class="payment-choice d-block p-2"><input type="radio" name="payment" value="whatsapp"> Confirm on WhatsApp</label><label class="payment-choice d-block p-2"><input type="radio" name="payment" value="bank" checked> Bank transfer</label></fieldset><button class="btn btn-glossy w-100 mt-3" type="submit">Place my order</button><p class="small text-center mt-3 mb-0">Your final delivery fee is calculated from your state and shown above.</p></div></aside></form></div></main><div data-footer></div><script src="https://js.paystack.co/v1/inline.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script><script src="/js/app.js" defer></script><script>
document.addEventListener('DOMContentLoaded',async()=>{
  const states=['Abia','Adamawa','Akwa Ibom','Anambra','Bauchi','Bayelsa','Benue','Borno','Cross River','Delta','Ebonyi','Edo','Ekiti','Enugu','Gombe','Imo','Jigawa','Kaduna','Kano','Katsina','Kebbi','Kogi','Kwara','Lagos','Nasarawa','Niger','Ogun','Ondo','Osun','Oyo','Plateau','Rivers','Sokoto','Taraba','Yobe','Zamfara','FCT'];
  const stateField=document.getElementById('state');
  stateField.innerHTML='<option value="">Choose your state</option>'+states.map(s=>`<option>${s}</option>`).join('');
  const cart=getCart();
  if(!cart.length){location.href='/cart.html';return}
  const subtotal=cart.reduce((n,x)=>n+x.price*x.qty,0);
  let settings={delivery_fee_default:5500,delivery_fee_lagos:3500,free_delivery_threshold:50000};
  try{const response=await api('/settings');settings={...settings,...(response.settings||{})}}catch{}
  const formatFee=()=>{if(!stateField.value)return 'Choose your state';const threshold=Number(settings.free_delivery_threshold||50000);if(subtotal>=threshold)return 'Free';const stateKey=`delivery_fee_${stateField.value.toLowerCase().replace(/[^a-z]/g,'')}`;return formatNGN(Number(settings[stateKey]??settings.delivery_fee_default??settings.shipping_fee??5500))};
  document.getElementById('summary').innerHTML=`<div class="d-flex justify-content-between"><span>Subtotal (${cart.reduce((n,x)=>n+x.qty,0)} items)</span><strong>${formatNGN(subtotal)}</strong></div><div class="d-flex justify-content-between mt-2"><span>Delivery</span><strong id="delivery">Choose your state</strong></div><hr><div class="d-flex justify-content-between h5"><span>Total</span><strong id="orderTotal">${formatNGN(subtotal)}</strong></div><p id="freeDeliveryHint" class="small text-muted mb-0"></p>`;
  const updateDelivery=()=>{const feeText=formatFee(),fee=feeText==='Free'?0:Number(settings[`delivery_fee_${stateField.value.toLowerCase().replace(/[^a-z]/g,'')}`]??settings.delivery_fee_default??settings.shipping_fee??5500);document.getElementById('delivery').textContent=feeText;document.getElementById('orderTotal').textContent=formatNGN(subtotal+(feeText==='Free'?0:fee));document.getElementById('freeDeliveryHint').textContent=subtotal<Number(settings.free_delivery_threshold||50000)?`Add ${formatNGN(Number(settings.free_delivery_threshold||50000)-subtotal)} more for free delivery.`:'Your order qualifies for free delivery.'};
  stateField.addEventListener('change',updateDelivery);
  const paystackRadio=document.querySelector('[name="payment"][value="paystack"]'),paystackKey=settings.paystackPublicKey;
  if(!paystackKey){paystackRadio.disabled=true;document.getElementById('paystackAvailability').textContent='Temporarily unavailable';}
  document.getElementById('checkout').onsubmit=async e=>{
    e.preventDefault();
    if(!e.target.reportValidity())return;
    const fd=new FormData(e.target),items=cart.map(x=>({productId:x.id,quantity:x.qty,size:x.size,color:x.color}));
    const body={customer:{fullName:fd.get('fullName'),phone:fd.get('phone'),email:fd.get('email'),address:fd.get('address'),state:fd.get('state'),notes:fd.get('notes')},items,paymentMethod:fd.get('payment')};
    const button=e.target.querySelector('[type="submit"]');button.disabled=true;button.textContent='Placing your order…';
    try{
      const res=await api('/orders',{method:'POST',body:JSON.stringify(body)});
      if(body.paymentMethod==='whatsapp'){
        const detail=cart.map(x=>`${x.qty} × ${x.name} (${x.size||'One size'}${x.color?`, ${x.color}`:''})`).join('\n');
        const msg=encodeURIComponent(`Hello Shop with Vikky, please confirm order ${res.order.orderNumber}.\n${detail}\nTotal: ${formatNGN(res.order.total)}`);
        setCart([]);location.href=`https://wa.me/2347030660694?text=${msg}`;
      }else if(body.paymentMethod==='bank'){
        setCart([]);location.href=`/success.html?order=${res.order.orderNumber}&method=bank`;
      }else{
        if(typeof PaystackPop==='undefined')throw new Error('Paystack could not load. Choose another payment option.');
        new PaystackPop().newTransaction({
          key:paystackKey,email:body.customer.email,amount:res.order.total*100,ref:res.order.orderNumber,
          metadata:{trackingCode:res.order.orderNumber},
          onSuccess:async payment=>{
            try{
              const verified=await api('/payments/paystack/verify',{method:'POST',body:JSON.stringify({trackingCode:res.order.orderNumber,reference:payment.reference})});
              if(!verified.verified)throw new Error('We could not confirm your payment yet.');
              setCart([]);location.href=`/success.html?order=${res.order.orderNumber}&reference=${payment.reference}`;
            }catch(error){toast(`${error.message} Your order number is ${res.order.orderNumber}.`)}
          },
          onClose:()=>toast('Payment window closed. Your order is still saved.')
        });
      }
    }catch(error){toast(error.message)}
    finally{button.disabled=false;button.textContent='Place my order'}
  };
});
</script></body></html>
